name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go: [ '1.24', '1.25' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Build Binary
        run: go build -v ./cmd/aih

      - name: Run Tests with Race Detector
        run: go test -v -race -covermode=atomic ./...

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./...
